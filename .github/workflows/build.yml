name: Build release assets

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Configure cache paths
        shell: pwsh
        run: |
          "XDG_CACHE_HOME=$env:RUNNER_TEMP/ccmemories-cache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP/ccmemories-cache/npm" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release
      - uses: actions/upload-artifact@v7
        with:
          name: ccmemories-release
          path: release/*
          compression-level: 0
          if-no-files-found: error
